services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffeeexplorer -d coffeeexplorer"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Not started by default -- day-to-day dev runs the backend and frontend
  # natively on the host instead (see repo root notes). These service
  # definitions exist so `docker compose --profile container up` can exercise
  # the full containerized stack locally, and docker-compose.prod.yml
  # reuses/extends them for actual deployment.
  backend:
    profiles: ["container"]
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4000
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - uploads:/app/uploads
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: ["container"]
    build:
      context: ./frontend/coffee-explorer
      target: dev
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./frontend/coffee-explorer:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    profiles: ["container"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM:-host.docker.internal:3000}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
  # Persists uploaded coffee-shop/visit photos across container recreation --
  # without this, every redeploy (a fresh backend container) would wipe them.
  uploads:
