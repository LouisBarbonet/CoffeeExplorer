services:
  postgres:
    # Don't publish 5432 to the public internet in prod (dev only).
    ports: !reset []

  # `!reset []` clears the dev-only "container" profile gate: in prod these
  # three always run (there's no host to run them natively on, and nginx is
  # the only thing that should be reachable from outside the VM).
  backend:
    profiles: !reset []
    image: ghcr.io/${GHCR_OWNER}/coffeeexplorer-backend:latest
    # `!reset` drops the base file's `build:`/dev bind-mounts entirely rather
    # than merging with them, so this service only ever runs the pulled image.
    build: !reset null
    # Keep the uploads volume (the only thing worth persisting here) but drop
    # the dev-only source bind-mount and node_modules volume.
    volumes: !override
      - uploads:/app/uploads
    ports: !reset []

  frontend:
    profiles: !reset []
    image: ghcr.io/${GHCR_OWNER}/coffeeexplorer-frontend:latest
    build: !reset null
    volumes: !reset []
    ports: !reset []

  nginx:
    profiles: !reset []
    environment:
      FRONTEND_UPSTREAM: frontend:3000
      DOMAIN: ${DOMAIN}
    # Base file mounts the plain-HTTP dev template; prod replaces it entirely
    # with the HTTPS-enabled one plus the Cloudflare Origin CA cert (see
    # DEPLOY.md's "About TLS" -- traffic reaches this VM only via Cloudflare's
    # proxy, which is why this is an Origin CA cert rather than a publicly
    # issued Let's Encrypt one).
    volumes: !override
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates-ssl:/etc/nginx/templates:ro
      - /etc/coffeeexplorer/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
